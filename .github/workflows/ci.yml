name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -t . -v

      - name: Verify CLI offline review (allow)
        run: |
          python -m safeops review --tool get_logs --set resource=web-api-prod

      - name: Verify CLI offline review (destructive deny)
        shell: bash
        run: |
          # The command should deny destructive tools and return exit code 2 (or non-zero)
          if python -m safeops review --tool terminate_instance --set resource_id=i-0safeops01; then
            echo "Expected policy to block destructive tool call!"
            exit 1
          else
            echo "Destructive tool call successfully blocked."
          fi
